<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Two of Us · 两个人的小宇宙</title>
    <meta
      name="description"
      content="收藏两个人的电影、音乐、游戏、旅途与亲密时光。"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="romance-bg" aria-hidden="true">
      <div class="romance-glow one"></div>
      <div class="romance-glow two"></div>
      <span
        class="romance-heart"
        style="--x: 9%; --size: 15px; --duration: 33s; --delay: -8s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 27%; --size: 21px; --duration: 39s; --delay: -25s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 43%; --size: 12px; --duration: 29s; --delay: -16s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 61%; --size: 17px; --duration: 36s; --delay: -4s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 77%; --size: 24px; --duration: 42s; --delay: -29s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 93%; --size: 14px; --duration: 31s; --delay: -21s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 54%; --size: 11px; --duration: 45s; --delay: -35s"
        >♡</span
      ><span
        class="romance-heart"
        style="--x: 35%; --size: 16px; --duration: 38s; --delay: -3s"
        >♡</span
      >
    </div>
    <section id="authPanel">
      <div class="logo">two of us</div>
      <h1>登录我们的共享空间</h1>
      <p class="subtitle">各自登录同一个 Supabase 项目，共享同一份条目。</p>
      <form id="authForm">
        <label class="field"
          >邮箱<input
            id="authEmail"
            type="email"
            autocomplete="email"
            required="" /></label
        ><label class="field"
          >密码<input
            id="authPassword"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required=""
        /></label>
        <div class="actions">
          <button class="btn" type="submit" value="login">登录</button
          ><button class="btn secondary" type="submit" value="signup">
            注册
          </button>
        </div>
      </form>
    </section>
    <div id="cloudNotice" role="status" aria-live="polite">
      <span id="cloudMessage">正在初始化…</span>
    </div>
    <aside>
      <div id="peopleArea" class="people-area">
        <button
          id="peopleToggle"
          class="people-toggle"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="peopleMenu"
        >
          <span id="person0" class="person-chip"></span
          ><span class="people-heart" aria-hidden="true">♡</span
          ><span id="person1" class="person-chip"></span
          ><span aria-hidden="true">⌄</span>
        </button>
        <div class="connection-status">
          <small id="syncState">未登录</small
          ><span id="cloudStatusSlot" aria-live="polite"></span>
        </div>
        <div
          id="peopleMenu"
          class="people-menu"
          role="menu"
          aria-label="个人与共享设置"
          hidden=""
        >
          <div class="menu-account" id="accountEmail"></div>
          <button id="editProfile" role="menuitem" type="button">
            设置我的头像和昵称</button
          ><button id="exportBackup" role="menuitem" type="button">
            导出 JSON 备份</button
          ><button id="inviteSpace" role="menuitem" type="button">
            生成邀请码</button
          ><button id="joinSpace" role="menuitem" type="button">
            邀请码加入</button
          ><button id="logout" role="menuitem" type="button">退出登录</button
          ><small id="profileHint" class="profile-hint" role="status"></small>
        </div>
      </div>
      <div class="logo">two of us<span>两个人的小宇宙</span></div>
      <nav id="nav"></nav>
      <div id="togetherNav" class="together-nav" hidden="">
        <button id="milestonesNav" type="button">
          ♡ 我们的纪念日
          <span
            id="milestonesUnread"
            class="unread-badge"
            hidden
          ></span></button
        ><button id="moodBottles" type="button">
          ✧ 心情瓶子 <span id="moodsUnread" class="unread-badge" hidden></span>
        </button>
        <p id="togetherHint" role="status"></p>
      </div>
      <div class="aside-label">OUR COLLECTIONS</div>
      <button class="listnav" data-list="wish">
        <span class="sidebar-icon" aria-hidden="true">♡</span
        ><span class="sidebar-label">我们的心愿单</span></button
      ><button class="listnav" data-list="doing">
        <span class="sidebar-icon" aria-hidden="true">◷</span
        ><span class="sidebar-label">正在一起做</span></button
      ><button class="listnav" data-list="done">
        <span class="sidebar-icon" aria-hidden="true">✓</span
        ><span class="sidebar-label">已完成的美好</span>
      </button>
      <div class="aside-bottom">
        <span class="heart">♥</span>
        &nbsp;把平凡的日子，过成收藏<br /><br /><small
          >EST. 2026 · ONLY FOR US</small
        >
      </div>
    </aside>
    <main>
      <header>
        <label class="search"
          >⌕
          <input
            id="search"
            placeholder="搜索我们的电影、音乐、目的地…"
            aria-label="搜索记录"
        /></label>
        <div class="spacer"></div>
        <button
          class="btn secondary message-button"
          id="messageButton"
          type="button"
          aria-label="打开条目消息"
          hidden=""
        >
          🔔 <span class="message-label">消息</span
          ><span id="messageUnread" class="unread-badge" hidden=""></span>
        </button>
        <div class="header-actions">
          <button id="ledgerNav" class="btn secondary" type="button" hidden>
            ▤ 双人记账</button
          ><button class="btn" id="add">＋ 新增回忆</button>
        </div>
      </header>
      <div id="content"></div>
      <div class="notice">
        记录保存在 Supabase 共享空间；封面、评分、进度与时长随条目共同同步。
      </div>
    </main>

    <div id="featureDialogs"></div>
    <script src="./supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
