/* Shared interaction feedback */
button, a[data-more], .card, .trip { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { position: relative; isolation: isolate; overflow: hidden; transition: transform .18s ease, background-color .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease, filter .22s ease; }
@media (hover: hover) {
 button:hover { transform: translateY(-2px); filter: brightness(1.12); box-shadow: 0 5px 16px #0003; }
 nav button:hover, .listnav:hover { background: #29272a; color: var(--accent); }
 nav button.active:hover { background: #423731; }
 .btn:hover { box-shadow: 0 6px 22px #efb99426; }
 .chip:hover { border-color: #a38069; color: #f4dbc8; }
 .chip.active:hover { color: #32251f; }
 .day:hover { background: #39313a; color: #f9d3c0; }
 .day.marked:hover { background: #66424a; }
 .actions .delete:hover { background: #66323b44; color: #ffc0c0; }
 .cal-head button:hover { background: #4a3a35; color: var(--accent); }
 .card:hover { transform: translateY(-5px); }
 .card:hover .poster { box-shadow: 0 10px 27px #0005, 0 0 0 1px #efb99466; }
 .card:hover h3 { color: var(--accent); }
 .trip:hover { transform: translateY(-3px); border-color: #806453; box-shadow: 0 10px 24px #0004; }
 a[data-more]:hover { color: var(--accent); transform: translateX(3px); }
 .leaflet-interactive:hover { stroke: #ffe0bd; fill: #ffcfab; stroke-width: 6; }
}
button:active { transform: translateY(1px) scale(.96); filter: brightness(.94); box-shadow: 0 1px 4px #0003; transition-duration: .07s; }
.card, .trip { transition: transform .23s ease, box-shadow .23s ease, border-color .23s ease; }
.trip { border: 1px solid transparent; }
.card .poster { transition: box-shadow .23s ease; }
.card h3 { transition: color .2s ease; }
.card:active, .trip:active { transform: scale(.975); transition-duration: .08s; }
a[data-more] { display: inline-block; transition: color .2s ease, transform .2s ease; }
a[data-more]:active { transform: translateX(3px) scale(.96); }
.leaflet-interactive { transition: fill .2s ease, stroke .2s ease, stroke-width .2s ease; }
.card:focus-visible, .trip:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 12px; }
.click-wave { position: absolute; display: block; pointer-events: none; border-radius: 50%; background: currentColor; opacity: .22; z-index: 3; transform: scale(0); animation: click-wave .55s ease-out forwards; }
@keyframes click-wave { to { transform: scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
 *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
 button:hover, button:active, .card:hover, .card:active, .trip:hover, .trip:active, a[data-more]:hover, a[data-more]:active { transform: none !important; }
 .click-wave { display: none; }
}

/* A quiet, romantic atmosphere behind the content. */
body { isolation: isolate; }
.romance-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; contain: strict; }
.romance-glow { position: absolute; width: 68vmax; height: 68vmax; border-radius: 50%; will-change: transform; }
.romance-glow.one { top: -40vmax; right: -18vmax; background: radial-gradient(circle, #b95c7b26 0%, #9b506b12 40%, transparent 68%); animation: romantic-drift 24s ease-in-out infinite alternate; }
.romance-glow.two { bottom: -38vmax; left: 3vw; background: radial-gradient(circle, #c78c6c20 0%, #b9697b0d 42%, transparent 68%); animation: romantic-drift 29s ease-in-out -12s infinite alternate-reverse; }
.romance-heart { position: absolute; left: var(--x); bottom: -40px; color: #e3a7bb; font: var(--size) Georgia, serif; opacity: 0; animation: romantic-rise var(--duration) linear var(--delay) infinite; will-change: transform, opacity; }
@keyframes romantic-drift { from { transform: translate3d(-3vw, 0, 0) scale(.95); } to { transform: translate3d(6vw, 8vh, 0) scale(1.12); } }
@keyframes romantic-rise { 0% { transform: translate3d(0, 0, 0) rotate(-12deg); opacity: 0; } 15% { opacity: .15; } 55% { opacity: .10; } 100% { transform: translate3d(45px, -110vh, 0) rotate(18deg); opacity: 0; } }
.search { transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease; transform-origin: center; }
.search:focus-within { background: #2b252d; border-color: #d49b87; box-shadow: 0 0 0 3px #e8a5ad12, 0 6px 25px #d2879a18; }
@media (hover: hover) { .search:hover { border-color: #a97e85; background: #29252d; box-shadow: 0 5px 22px #d2879a14; } }
.search.is-bouncing { animation: search-bounce .54s cubic-bezier(.22,.7,.3,1); }
.search.is-typing { animation: search-type .32s ease-out; }
@keyframes search-bounce { 0%,100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-5px) scale(1.014); } 52% { transform: translateY(2px) scale(.993); } 75% { transform: translateY(-1.5px) scale(1.004); } }
@keyframes search-type { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-2px); } 75% { transform: translateY(.6px); } }
@media (max-width: 750px) { .romance-heart:nth-of-type(n+7) { display: none; } }
@media (prefers-reduced-motion: reduce) { .romance-glow, .romance-heart, .search.is-bouncing, .search.is-typing { animation: none !important; will-change: auto; transform: none !important; } .romance-heart { display: none; } }

.poster.wrap-cover img { width:210%; max-width:none; height:100%; object-fit:fill; position:relative; left:-110%; }

function render(){if(!cloudUser)return;if(map){map.remove();map=null}document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let arr=records.filter(r=>(page==='home'||r.cat===page)&&(filter==='全部'||r.sub===filter)&&(!stateFilter||r.state===stateFilter)&&(!genreFilter||parseGenres(r.genres).includes(genreFilter))&&(!query||(r.title+r.desc+(r.place||'')+parseGenres(r.genres).join(' ')).toLowerCase().includes(query.toLowerCase())));let html='';if(page==='home'&&!stateFilter&&!query&&!genreFilter){html=`<section class="hero"><div><span class="eyebrow">A LITTLE WORLD, JUST FOR TWO</span><h1>把喜欢的事，<br>都和你一起。</h1><p>一部电影，一首歌，一场说走就走的旅行。<br>这里收藏我们的共同喜好，也记录每一次心动。</p><div class="small">✧ &nbsp; 下一次约会，从一个小小的心愿开始</div></div><div class="hero-count"><div><strong>${records.filter(r=>r.state==='done').length}</strong><small>共同回忆</small></div><div><strong>${records.filter(r=>r.state==='wish').length}</strong><small>未来可期</small></div></div></section><div class="heading"><h2>◷ &nbsp;我们的进行时</h2><small>有你在，每件事都变得有趣</small><a data-more="doing">查看全部 →</a></div><div class="grid">${records.filter(r=>r.state==='doing'&&r.cat!=='intimacy').map(card).join('')}</div><div class="heading"><h2>一起收藏的美好</h2><small>慢慢体验，慢慢喜欢</small><a data-more="wish">心愿清单 →</a></div>`}else{html=`<h1 class="section-title">${stateFilter?{wish:'我们的心愿单',doing:'正在一起做',done:'已完成的美好'}[stateFilter]:cats[page][1]}</h1><p class="subtitle">${{home:'把想做的事放在这里，把未来留给我们。',film:'从片头到片尾，身边一直是你。',music:'有些旋律一响起，就想起了你。',game:'最佳队友，永远是你。',travel:'把世界慢慢走成我们的地图。',intimacy:'只属于我们共同记录的亲密时光。'}[page]}</p>`}

function calendar(){let year=month.getFullYear(),m=month.getMonth(),offset=(new Date(year,m,1).getDay()+6)%7,count=new Date(year,m+1,0).getDate();return `<div class="calendar"><div class="cal-head"><button data-month="-1" aria-label="上个月">←</button><b>${year} 年 ${m+1} 月</b><button data-month="1" aria-label="下个月">→</button></div><div class="days">${['一','二','三','四','五','六','日'].map(d=>`<div class="week">${d}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:count},(_,i)=>{let date=`${year}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,n=records.filter(r=>r.cat==='intimacy'&&r.date===date).length;return `<button class="day ${n?'marked':''} ${date===selectedDate?'selected':''}" data-day="${date}">${i+1}${n?' <span style="float:right">♥</span>':''}</button>`}).join('')}</div></div>`}

function field(name,label,type='text',value='',full=false){let input=type==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${name==='title'?'required maxlength="100"':''} ${name==='score'?'min="0" max="10" step="0.1"':''} ${name==='lat'?'min="-90" max="90" step="any"':''} ${name==='lng'?'min="-180" max="180" step="any"':''}>`;return `<label class="field ${full?'full':''}">${label}${input}</label>`}

const COVER_UPLOAD_WORKER_URL = 'https://r2-presigner.baopengtoskr.workers.dev/';
const R2_PUBLIC_BASE_URL = 'https://pub-e97c7ebcf6e7475d85a27152bc869d5f.r2.dev';

function setupCoverUpload() {
  const input = $('#coverUpload');
  const url = $('[name=image]');
  const preview = $('#coverPreview');
  const message = $('#coverMessage');
  const save = $('#form button[type=submit]');
  function show() {
    preview.hidden = !url.value;
    preview.src = url.value;
  }
  show();
  url.addEventListener('input', show);

  async function timedFetch(address, options, milliseconds) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), milliseconds);
    try { return await fetch(address, { ...options, signal: controller.signal }); }
    finally { clearTimeout(timer); }
  }

  input.onchange = async () => {
    const file = input.files[0];
    if (!file || coverBusy) return;
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      message.textContent = '请选择 JPG、PNG 或 WebP 图片。';
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      message.textContent = '请选择小于 20 MB 的图片。';
      return;
    }
    const epoch = cloudEpoch;
    let objectUrl, phase = '压缩图片';
    coverBusy = true;
    input.disabled = true;
    url.disabled = true;
    save.disabled = true;
    message.textContent = '正在压缩封面…';
    try {
      requireCloudUser();
      objectUrl = URL.createObjectURL(file);
      const picture = new Image();
      await new Promise((resolve, reject) => {
        picture.onload = resolve;
        picture.onerror = () => reject(new Error('无法读取图片，请更换文件。'));
        picture.src = objectUrl;
      });
      const scale = Math.min(1, 400 / Math.max(picture.naturalWidth, picture.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(picture.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(picture.naturalHeight * scale));
      const context = canvas.getContext('2d');
      if (!context) throw new Error('浏览器无法创建图片压缩画布。');
      context.fillStyle = '#1b1c22';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(picture, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob(value => value ? resolve(value)
          : reject(new Error('JPEG 压缩失败。')), 'image/jpeg', 0.6);
      });

      phase = '获取上传地址';
      message.textContent = '正在获取 R2 上传地址…';
      const { data, error } = await cloud.auth.getSession();
      if (error) throw error;
      if (!data.session?.access_token) throw new Error('登录已失效，请重新登录。');
      const filename = (file.name.replace(/\.[^.]+$/, '') || 'cover') + '.jpg';
      const response = await timedFetch(COVER_UPLOAD_WORKER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + data.session.access_token
        },
        body: JSON.stringify({ filename, contentType: 'image/jpeg' })
      }, 20000);
      let result;
      try { result = await response.json(); }
      catch { throw new Error(`Worker 没有返回有效 JSON（HTTP ${response.status}）。`); }
      if (!response.ok) throw new Error(result.error || `Worker 请求失败（HTTP ${response.status}）。`);
      if (typeof result.uploadUrl !== 'string' || typeof result.publicUrl !== 'string')
        throw new Error('Worker 响应缺少 uploadUrl 或 publicUrl。');
      const upload = new URL(result.uploadUrl);
      const publicAddress = new URL(result.publicUrl);
      if (upload.protocol !== 'https:' || upload.username || upload.password ||
        !upload.hostname.endsWith('.r2.cloudflarestorage.com') ||
        !upload.pathname.startsWith('/covers/covers/') ||
        publicAddress.origin !== new URL(R2_PUBLIC_BASE_URL).origin ||
        !publicAddress.pathname.startsWith('/covers/'))
        throw new Error('Worker 返回的上传地址或公开域名不符合配置。');

      phase = 'PUT 上传图片';
      message.textContent = '正在上传封面到 R2…';
      const uploaded = await timedFetch(upload.href, {
        method: 'PUT',
        // 必须与签名时一致；不要附带 Supabase Authorization。
        headers: { 'Content-Type': 'image/jpeg' },
        body: blob
      }, 120000);
      if (!uploaded.ok)
        throw new Error(`R2 上传失败（HTTP ${uploaded.status}），请检查签名、Content-Type 和桶权限。`);
      if (epoch !== cloudEpoch || !url.isConnected)
        throw new Error('登录状态或编辑窗口已变化，请重新打开记录。');
      // 原表单保存逻辑会将这个输入框的值写入 data.image。
      // 只有上传成功后才替换，因此失败时保留原封面链接。
      url.value = publicAddress.href;
      show();
      message.textContent = '封面已上传。点击「保存记录」后，两个人都能看到。';
    } catch (error) {
      const detail = error.name === 'AbortError' ? '请求超时，请稍后重试。'
        : error instanceof TypeError ? '网络请求失败，请检查 Worker 与 R2 的 CORS、网址及网络。'
        : friendlyError(error);
      message.textContent = `封面上传失败（${phase}）：${detail} 可改用图片链接。`;
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      coverBusy = false;
      input.disabled = false;
      url.disabled = false;
      save.disabled = false;
    }
  };
}

function buttonWave(button, x, y) {
 if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
 const rect = button.getBoundingClientRect();
 const size = Math.hypot(rect.width, rect.height) * 2;
 const wave = document.createElement('span');
 wave.className = 'click-wave';
 wave.setAttribute('aria-hidden', 'true');
 wave.style.width = wave.style.height = size + 'px';
 wave.style.left = (x - rect.left - size / 2) + 'px';
 wave.style.top = (y - rect.top - size / 2) + 'px';
 button.appendChild(wave);
 wave.addEventListener('animationend', () => wave.remove(), { once: true });
 setTimeout(() => wave.remove(), 650);
}
document.addEventListener('pointerdown', e => {
 if (e.button !== 0) return;
 const button = e.target.closest('button');
 if (button && !button.disabled) buttonWave(button, e.clientX, e.clientY);
});
document.addEventListener('keydown', e => {
 if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
 const button = e.target.closest('button');
 if (button && !button.disabled) {
  const rect = button.getBoundingClientRect();
  buttonWave(button, rect.left + rect.width / 2, rect.top + rect.height / 2);
 }
});

function friendlyError(error) {

  if (/email not confirmed/i.test(text)) return '邮箱尚未确认，请先点击确认邮件里的链接。';
  if (/already registered/i.test(text)) return '该邮箱已注册，请直接登录。';

// content 保持 text 类型，使用 JSON 保存原网页的封面、类型、评分和进度等字段。
function decodeRow(row) {
  let value;
  try { value = JSON.parse(row.content); } catch { value = { title: row.content }; }
  if (!value || typeof value !== 'object' || Array.isArray(value)) value = { title: row.content };
  const cat = Object.hasOwn(subs, value.cat) ? value.cat : 'film';
  const item = { id: row.id, cat, sub: subs[cat].includes(value.sub) ? value.sub : subs[cat][0],
    state: ['wish','doing','done'].includes(value.state) ? value.state : 'wish' };
  for (const key of ['title','desc','image','coverImage','coverSource','coverStatus','platform','note','place','hotel','brand','date']) {
    item[key] = typeof value[key] === 'string' ? value[key] : '';
  }
  item.title ||= '未命名条目';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(item.date))item.date='';
  item.coverWrap = value.coverWrap === true;
  item.genres = parseGenres(value.genres);
  for (const key of ['score','progress','watchedEpisodes','totalEpisodes','currentEpisode','playHours']) {
    item[key] = Math.max(0, finiteNumber(value[key]));
  }
  item.lat = coordinate(value.lat,90);
  item.lng = coordinate(value.lng,180);
  // 只允许常见图片协议；文本仍通过原网页 esc() 转义后呈现。
  for (const key of ['image','coverImage']) {
    if (!/^(https?:\/\/|data:image\/(?:jpeg|png|webp);base64,)/i.test(item[key]) || (item[key].startsWith('data:')&&item[key].length>MAX_COVER_DATA_LENGTH)) item[key] = '';
  }
  if (!/^https?:\/\//i.test(item.coverSource)) item.coverSource = '';
  return normalizeItem(item);
}

        .select('id,content,shared_id,created_by,created_at')
        .eq('shared_id', CONFIG.SHARED_ID)
        .order('created_at', { ascending: true }).order('id', { ascending: true })
        .range(start, start + 499);
      if (error) throw error;
      if (epoch !== cloudEpoch || version !== loadVersion) return;
      rows.push(...data);
      if (data.length < 500) break;
    }
    if (epoch !== cloudEpoch || version !== loadVersion || !cloudUser) return;
    rawRows.clear(); rows.forEach(row => rawRows.set(row.id, row));
    records = rows.map(decodeRow); listLoading=false;render();
    cloudMessage('共享列表已更新');
  } catch (error) {
    if (epoch === cloudEpoch && version === loadVersion) {listLoading=false;render();cloudMessage('加载失败：' + friendlyError(error));}
  }
}
async function activateSession(session) {
  const user = session?.user || null;
  if (user && cloudUser?.id === user.id) {
    await cloud.realtime.setAuth(session.access_token);
    return;
  }
  const epoch = ++cloudEpoch;
  ++loadVersion;
  const old = cloudChannel; cloudChannel = null;
  cloudUser = user; setSignedIn(null);
  if (old) await cloud.removeChannel(old);
  if (epoch !== cloudEpoch) return;
  setSignedIn(user);
  if (!user) { $('#syncState').textContent = '未登录'; return; }
  cloudMessage('正在加载共享列表…');
  await cloud.realtime.setAuth(session.access_token);
  if (epoch !== cloudEpoch) return;
  const reload = () => { if (epoch === cloudEpoch) void loadSharedItems(); };
  const reloadPeople=()=>{if(epoch===cloudEpoch)void loadPeople()};
  cloudChannel = cloud.channel('shared-items-' + user.id)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'shared_items',
      filter: `shared_id=eq.${CONFIG.SHARED_ID}`
    }, reload)
    .on('postgres_changes', {event:'UPDATE',schema:'public',table:'shared_items',filter:`shared_id=eq.${CONFIG.SHARED_ID}`}, reload)
    // DELETE 不支持列过滤；这里只将其作为重新查询信号，不展示事件数据。
    // 重新 SELECT 时仍按 shared_id 过滤，并由数据库 RLS 强制鉴权。
    .on('postgres_changes', {
      event: 'DELETE', schema: 'public', table: 'shared_items'
    }, reload)
    .subscribe(status => {
      if (epoch !== cloudEpoch) return;
      $('#syncState').textContent = status === 'SUBSCRIBED' ? '实时同步已连接' : '实时连接：' + status;
      if (status === 'SUBSCRIBED') {reload();reloadPeople();}
      if (['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)) {
        cloudMessage('实时连接暂时中断，重连后会重新加载。请检查网络和 Realtime 配置。');
      }
    });
  // 建立订阅后再加载；订阅成功和重连成功也重新加载，以补齐连接期间的变动。
  void loadSharedItems();void loadPeople();
}
async function saveSharedItem(item, id, expectedContent) {
  requireCloudUser();
  normalizeItem(item);validCoverSize(item);
  const content = JSON.stringify(item);
  if (id) {
    // 原子替换保留编辑体验，无需新增 UPDATE 策略；并发冲突由数据库检查。
    const { error } = await cloud.rpc('replace_shared_item', {
      p_id: id, p_content: content, p_expected_content: expectedContent
    });
    if (error) throw error;
  } else {
    // 不传 created_by，由数据库 auth.uid() 自动填写；RLS 同时防止伪造。
    const { error } = await cloud.from('shared_items').insert({ content, shared_id: CONFIG.SHARED_ID });
    if (error) throw error;
  }
}
async function deleteSharedItem(id) {
  requireCloudUser();
  const { data, error } = await cloud.from('shared_items').delete()
    .eq('id', id).eq('shared_id', CONFIG.SHARED_ID).select('id');
  if (error) throw error;
  if (!data.length) throw new Error('这条记录已删除，或你没有删除权限。');
}
async function initSharedCloud() {
  initPeopleUI();
  $('#authForm').onsubmit = async event => {
    event.preventDefault(); if (!cloud) return;
    const buttons = $('#authForm').querySelectorAll('button');
    buttons.forEach(button => button.disabled = true);
    cloudMessage('正在处理…');
    try {
      const credentials = { email: $('#authEmail').value.trim(), password: $('#authPassword').value };
      const signup = event.submitter?.value === 'signup';
      const { data, error } = signup
        ? await cloud.auth.signUp(credentials)
        : await cloud.auth.signInWithPassword(credentials);
      if (error) throw error;
      $('#authPassword').value = '';
      cloudMessage(signup && !data.session ? '注册请求已提交，请查看确认邮件；已注册用户请直接登录。' : '登录成功，正在加载…');
      if (data.session) await activateSession(data.session);
    } catch (error) { cloudMessage(friendlyError(error)); }
    finally { buttons.forEach(button => button.disabled = false); }
  };
  $('#exportBackup').onclick=()=>{if(!cloudUser)return;const blob=new Blob([JSON.stringify({version:1,shared_id:CONFIG.SHARED_ID,exported_at:new Date().toISOString(),items:records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='two-of-us-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前已加载记录，备份可能包含私密内容')};
  $('#inviteSpace').hidden=CONFIG.ACCESS_MODE!=='members';$('#joinSpace').hidden=CONFIG.ACCESS_MODE!=='members';
  $('#inviteSpace').onclick=async()=>{try{requireCloudUser();const {data,error}=await cloud.rpc('create_shared_invite',{p_shared_id:CONFIG.SHARED_ID});if(error)throw error;prompt('一次性邀请码，有效期 24 小时。仅发送给对方：',data)}catch(error){cloudMessage(friendlyError(error))}};
  $('#joinSpace').onclick=async()=>{const token=prompt('粘贴对方发送的一次性邀请码');if(!token)return;try{requireCloudUser();const {data,error}=await cloud.rpc('join_shared_space',{p_token:token.trim()});if(error)throw error;if(data!==CONFIG.SHARED_ID){cloudMessage('已加入空间 '+data+'；请将配置 SHARED_ID 改为该值后重新打开网页。');return}await loadSharedItems();await loadPeople();cloudMessage('已加入共享空间')}catch(error){cloudMessage(friendlyError(error))}};
  $('#logout').onclick = async () => {
    if (writeBusy||avatarBusy||profileSaving) { toast('正在保存，请稍后退出'); return; }
    const { error } = await cloud.auth.signOut({ scope: 'local' });
    if (error) { cloudMessage(friendlyError(error)); return; }
    await activateSession(null); cloudMessage('已退出登录');
  };
  if (!/^https:\/\//.test(CONFIG.SUPABASE_URL||'') || !CONFIG.SUPABASE_ANON_KEY || !CONFIG.SHARED_ID) {
    cloudMessage('请在同目录 supabase-config.js 中配置 Project URL、publishable key 和 SHARED_ID。'); return;
  }
  if (!window.supabase?.createClient) { cloudMessage('Supabase SDK 加载失败，请检查网络或 CDN。'); return; }
  try {
    cloud = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    // 回调中不等待其他 Auth API，避免会话锁死；INITIAL_SESSION 也走这里。
    cloud.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => { void activateSession(session).catch(error => cloudMessage(friendlyError(error))); }, 0);
    });
  } catch (error) { cloudMessage(friendlyError(error)); }
  window.addEventListener('online', () => { if (cloudUser) {void loadSharedItems();void loadPeople();} });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cloudUser) {void loadSharedItems();void loadPeople();}
  });
}
// 个人资料独立保存，只有本人可写；空间内的两位成员可读。
let profilesChannel=null;
let sharedPeople=[], peopleVersion=0, profileAvatarDraft='', avatarBusy=false, profileSaving=false;
let profileReturnFocus=null;
function profileName(person,index){return person?.nickname?.trim()||['A','B'][index]||'我们'}
function profileAvatar(value){return typeof value==='string'&&value.length<=60000&&/^data:image\/(jpeg|png|webp);base64,/.test(value)?value:''}
function renderPeople(){
 for(let index=0;index<2;index++){
  const person=sharedPeople[index],name=profileName(person,index),box=$('#person'+index);
  box.replaceChildren();const circle=document.createElement('span');circle.className='person-photo';
  const picture=profileAvatar(person?.avatar);
  circle.textContent=Array.from(name)[0]||'我';
  if(picture){const image=document.createElement('img');image.src=picture;image.alt='';image.addEventListener('error',()=>image.remove(),{once:true});circle.append(image)}
  const label=document.createElement('span');label.className='person-name';label.textContent=name;box.append(circle,label);
 }
 $('#peopleToggle').setAttribute('aria-label',sharedPeople.map(profileName).join('和')+'，打开个人菜单');
}
function profilesError(error){
 const text=String(error?.message||error||'');
 return /PGRST202|PGRST205|schema cache|get_shared_people|does not exist/.test(text)?'个人资料同步尚未启用，请执行 04-shared-profiles.sql。':friendlyError(error);
}
async function loadPeople(){
 if(!cloudUser)return;
 const epoch=cloudEpoch,version=++peopleVersion;
 try{
  const {data,error}=await cloud.rpc('get_shared_people',{p_shared_id:CONFIG.SHARED_ID});if(error)throw error;
  if(epoch!==cloudEpoch||version!==peopleVersion)return;
  sharedPeople=(data||[]).map(p=>({user_id:p.user_id,nickname:String(p.nickname||'').slice(0,24),avatar:profileAvatar(p.avatar)}));
  renderPeople();$('#profileHint').textContent='';
  if(!profilesChannel){const reload=()=>{if(epoch===cloudEpoch)void loadPeople()};profilesChannel=cloud.channel('shared-profiles-'+cloudUser.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'shared_profiles',filter:`shared_id=eq.${CONFIG.SHARED_ID}`},reload)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'shared_profiles',filter:`shared_id=eq.${CONFIG.SHARED_ID}`},reload)
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'shared_profiles'},reload)
   .subscribe(status=>{if(epoch!==cloudEpoch)return;if(status==='SUBSCRIBED')reload();if(['CHANNEL_ERROR','TIMED_OUT'].includes(status))$('#profileHint').textContent='个人资料实时连接暂时中断，重连后会重新加载。'});}
 }catch(error){if(epoch===cloudEpoch&&version===peopleVersion)$('#profileHint').textContent=profilesError(error)}
}
function closePeopleMenu(restore=true){
 const wasOpen=!$('#peopleMenu').hidden;$('#peopleMenu').hidden=true;$('#peopleToggle').setAttribute('aria-expanded','false');
 if(wasOpen&&restore)$('#peopleToggle').focus();
}
function closeProfile(){
 if(avatarBusy||profileSaving)return;
 $('#profileModal').hidden=true;(profileReturnFocus?.isConnected?profileReturnFocus:$('#peopleToggle')).focus();
}
function refreshAvatarPreview(){
 const preview=$('#myAvatarPreview');preview.replaceChildren();
 if(profileAvatar(profileAvatarDraft)){const image=document.createElement('img');image.src=profileAvatarDraft;image.alt='我的头像预览';preview.append(image)}
 else preview.textContent=($('#myNickname').value.trim()||'我').slice(0,1);
}
function initPeopleUI(){
 renderPeople();
 $('#peopleToggle').onclick=()=>{const open=$('#peopleMenu').hidden;$('#peopleMenu').hidden=!open;$('#peopleToggle').setAttribute('aria-expanded',String(open));if(open)$('#peopleMenu button:not([hidden])').focus()};
 document.addEventListener('click',event=>{if(!$('#peopleArea').contains(event.target))closePeopleMenu(false)});
 $('#peopleArea').addEventListener('keydown',event=>{
  if($('#peopleMenu').hidden)return;
  if(event.key==='Escape'){event.preventDefault();closePeopleMenu();return}
  if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){
   event.preventDefault();const buttons=[...$('#peopleMenu').querySelectorAll('button')].filter(b=>!b.hidden&&!b.disabled),i=buttons.indexOf(document.activeElement);
   const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(i+(event.key==='ArrowUp'?-1:1)+buttons.length)%buttons.length;buttons[next]?.focus();
  }
 });
 // Safari 点击按钮时可能先产生 relatedTarget=null 的 focusout，不能在此时隐藏菜单。
 // 改为焦点真正进入外部元素时关闭，避免按钮在 click 派发前消失。
 document.addEventListener('focusin',event=>{if(!$('#peopleArea').contains(event.target))closePeopleMenu(false)});
 for(const id of ['exportBackup','inviteSpace','joinSpace','logout'])$('#'+id).addEventListener('click',()=>closePeopleMenu(false));
 $('#editProfile').onclick=()=>{
  profileReturnFocus=$('#peopleToggle');closePeopleMenu(false);
  const me=sharedPeople.find(p=>p.user_id===cloudUser?.id);
  $('#myNickname').value=me?.nickname||'';profileAvatarDraft=profileAvatar(me?.avatar);$('#myAvatarFile').value='';$('#profileFormMessage').textContent='头像和昵称仅可修改自己的，对方会同步看到。';refreshAvatarPreview();$('#profileModal').hidden=false;$('#myNickname').focus();
 };
 $('#myNickname').oninput=refreshAvatarPreview;$('#profileCancel').onclick=closeProfile;
 $('#profileModal').onclick=e=>{if(e.target===$('#profileModal'))closeProfile()};
 $('#removeMyAvatar').onclick=()=>{if(avatarBusy||profileSaving)return;profileAvatarDraft='';refreshAvatarPreview()};
 $('#myAvatarFile').onchange=async()=>{
  const file=$('#myAvatarFile').files[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>20*1024*1024){$('#profileFormMessage').textContent='请选择 20 MB 以内的 JPG、PNG 或 WebP 图片。';return}
  avatarBusy=true;$('#profileSave').disabled=true;let objectURL;
  try{
   objectURL=URL.createObjectURL(file);const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=objectURL});
   const canvas=document.createElement('canvas');canvas.width=192;canvas.height=192;const context=canvas.getContext('2d'),side=Math.min(image.width,image.height);
   context.fillStyle='#34302e';context.fillRect(0,0,192,192);context.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,192,192);
   const avatar=canvas.toDataURL('image/jpeg',.78);if(avatar.length>60000)throw new Error('头像过大，请换一张简单的图片。');
   profileAvatarDraft=avatar;refreshAvatarPreview();$('#profileFormMessage').textContent='头像已准备，点击保存后同步。';
  }catch(error){$('#profileFormMessage').textContent=error.message||'头像读取失败，请重新选择。'}
  finally{if(objectURL)URL.revokeObjectURL(objectURL);avatarBusy=false;$('#profileSave').disabled=false}
 };
 $('#profileForm').onsubmit=async event=>{
  event.preventDefault();if(avatarBusy||profileSaving)return;
  const epoch=cloudEpoch;profileSaving=true;$('#profileSave').disabled=true;
  try{
   requireCloudUser();const nickname=$('#myNickname').value.trim();if(nickname.length>24)throw new Error('昵称最多 24 个字符。');
   const {error}=await cloud.from('shared_profiles').upsert({shared_id:CONFIG.SHARED_ID,user_id:cloudUser.id,nickname,avatar:profileAvatarDraft,updated_at:new Date().toISOString()},{onConflict:'shared_id,user_id'});if(error)throw error;
   if(epoch!==cloudEpoch)return;
   await loadPeople();profileSaving=false;closeProfile();toast('头像和昵称已保存');
  }catch(error){if(epoch===cloudEpoch)$('#profileFormMessage').textContent=profilesError(error)}
  finally{profileSaving=false;$('#profileSave').disabled=false}
 };
 document.addEventListener('keydown',event=>{
  if($('#profileModal').hidden)return;
  if(event.key==='Escape'){event.preventDefault();closeProfile();return}
  if(event.key==='Tab'){
   const nodes=[...$('#profileForm').querySelectorAll('button,input')].filter(n=>!n.disabled&&n.getClientRects().length),first=nodes[0],last=nodes.at(-1);
   if(event.shiftKey&&(document.activeElement===first||!$('#profileForm').contains(document.activeElement))){event.preventDefault();last.focus()}
   else if(!event.shiftKey&&(document.activeElement===last||!$('#profileForm').contains(document.activeElement))){event.preventDefault();first.focus()}
  }
 });
}
