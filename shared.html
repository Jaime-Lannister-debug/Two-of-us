/* Shared interaction feedback */
button, a[data-more], .card, .trip { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { position: relative; isolation: isolate; overflow: hidden; transition: transform .18s ease, background-color .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease, filter .22s ease; }
@media (hover: hover) {
 button:hover { transform: translateY(-2px); filter: brightness(1.12); box-shadow: 0 5px 16px #0003; }
 nav button:hover, .listnav:hover { background: #29272a; color: var(--accent); }
 nav button.active:hover { background: #423731; }
 .btn:hover { box-shadow: 0 6px 22px #efb99426; }
 .chip:hover { border-color: #a38069; color: #f4dbc8; }
 .chip.active:hover { color: #32251f; }
 .day:hover { background: #39313a; color: #f9d3c0; }
 .day.marked:hover { background: #66424a; }
 .actions .delete:hover { background: #66323b44; color: #ffc0c0; }
 .cal-head button:hover { background: #4a3a35; color: var(--accent); }
 .card:hover { transform: translateY(-5px); }
 .card:hover .poster { box-shadow: 0 10px 27px #0005, 0 0 0 1px #efb99466; }
 .card:hover h3 { color: var(--accent); }
 .trip:hover { transform: translateY(-3px); border-color: #806453; box-shadow: 0 10px 24px #0004; }
 a[data-more]:hover { color: var(--accent); transform: translateX(3px); }
 .leaflet-interactive:hover { stroke: #ffe0bd; fill: #ffcfab; stroke-width: 6; }
}
button:active { transform: translateY(1px) scale(.96); filter: brightness(.94); box-shadow: 0 1px 4px #0003; transition-duration: .07s; }
.card, .trip { transition: transform .23s ease, box-shadow .23s ease, border-color .23s ease; }
.trip { border: 1px solid transparent; }
.card .poster { transition: box-shadow .23s ease; }
.card h3 { transition: color .2s ease; }
.card:active, .trip:active { transform: scale(.975); transition-duration: .08s; }
a[data-more] { display: inline-block; transition: color .2s ease, transform .2s ease; }
a[data-more]:active { transform: translateX(3px) scale(.96); }
.leaflet-interactive { transition: fill .2s ease, stroke .2s ease, stroke-width .2s ease; }
.card:focus-visible, .trip:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 12px; }
.click-wave { position: absolute; display: block; pointer-events: none; border-radius: 50%; background: currentColor; opacity: .22; z-index: 3; transform: scale(0); animation: click-wave .55s ease-out forwards; }
@keyframes click-wave { to { transform: scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
 *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
 button:hover, button:active, .card:hover, .card:active, .trip:hover, .trip:active, a[data-more]:hover, a[data-more]:active { transform: none !important; }
 .click-wave { display: none; }
}

/* A quiet, romantic atmosphere behind the content. */
body { isolation: isolate; }
.romance-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; contain: strict; }
.romance-glow { position: absolute; width: 68vmax; height: 68vmax; border-radius: 50%; will-change: transform; }
.romance-glow.one { top: -40vmax; right: -18vmax; background: radial-gradient(circle, #b95c7b26 0%, #9b506b12 40%, transparent 68%); animation: romantic-drift 24s ease-in-out infinite alternate; }
.romance-glow.two { bottom: -38vmax; left: 3vw; background: radial-gradient(circle, #c78c6c20 0%, #b9697b0d 42%, transparent 68%); animation: romantic-drift 29s ease-in-out -12s infinite alternate-reverse; }
.romance-heart { position: absolute; left: var(--x); bottom: -40px; color: #e3a7bb; font: var(--size) Georgia, serif; opacity: 0; animation: romantic-rise var(--duration) linear var(--delay) infinite; will-change: transform, opacity; }
@keyframes romantic-drift { from { transform: translate3d(-3vw, 0, 0) scale(.95); } to { transform: translate3d(6vw, 8vh, 0) scale(1.12); } }
@keyframes romantic-rise { 0% { transform: translate3d(0, 0, 0) rotate(-12deg); opacity: 0; } 15% { opacity: .15; } 55% { opacity: .10; } 100% { transform: translate3d(45px, -110vh, 0) rotate(18deg); opacity: 0; } }
.search { transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease; transform-origin: center; }
.search:focus-within { background: #2b252d; border-color: #d49b87; box-shadow: 0 0 0 3px #e8a5ad12, 0 6px 25px #d2879a18; }
@media (hover: hover) { .search:hover { border-color: #a97e85; background: #29252d; box-shadow: 0 5px 22px #d2879a14; } }
.search.is-bouncing { animation: search-bounce .54s cubic-bezier(.22,.7,.3,1); }
.search.is-typing { animation: search-type .32s ease-out; }
@keyframes search-bounce { 0%,100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-5px) scale(1.014); } 52% { transform: translateY(2px) scale(.993); } 75% { transform: translateY(-1.5px) scale(1.004); } }
@keyframes search-type { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-2px); } 75% { transform: translateY(.6px); } }
@media (max-width: 750px) { .romance-heart:nth-of-type(n+7) { display: none; } }
@media (prefers-reduced-motion: reduce) { .romance-glow, .romance-heart, .search.is-bouncing, .search.is-typing { animation: none !important; will-change: auto; transform: none !important; } .romance-heart { display: none; } }

.poster.wrap-cover img { width:210%; max-width:none; height:100%; object-fit:fill; position:relative; left:-110%; }
.poster.wrap-cover .poster-title { display:none; }
.poster.wrap-cover .tag { top:auto; bottom:10px; left:9px; font-size:9px; max-width:68%; }
.poster.wrap-cover .score { bottom:14px; }
.poster:not(.wrap-cover) .cover-pending { position:absolute; top:50%; left:18px; color:#bca8ac; font-size:11px; }
.poster.missing-cover .poster-title { display:block; }
.genre-badges { display:flex; gap:5px; flex-wrap:wrap; margin:10px 0 3px; }

/* 未登录时隐藏条目、导航和新增入口，数据库仍通过 RLS 独立鉴权。 */
body:not(.signed-in)>aside,body:not(.signed-in)>main{display:none}
body.signed-in #authPanel{display:none}
#authPanel{position:relative;max-width:450px;margin:12vh auto 30px;padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#authPanel .field{margin:18px 0}#authPanel h1{font-size:26px}
#cloudNotice{position:relative;z-index:25;max-width:800px;margin:15px auto;padding:12px 18px;color:#d1bbaa;font-size:12px;line-height:1.7}
body.signed-in #cloudNotice{margin-left:250px}
#cloudAccount{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:14px 0;flex-wrap:wrap}
#cloudAccount small{color:var(--muted)}
button:disabled{opacity:.55;cursor:wait}
@media(max-width:750px){body.signed-in #cloudNotice{margin-left:0}#authPanel{margin:8vh 15px 20px}}

Modal .dialog{width:440px}.my-avatar-preview{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;overflow:hidden;background:#b98983;font-size:30px;margin:0 auto 24px}.my-avatar-preview img{height:100%;width:100%;object-fit:cover}#profileFormMessage{color:var(--muted);font-size:12px;line-height:1.7;margin-top:18px}

// 仅这两个 R2 相关地址出现在前端；R2 密钥只配置在 Worker。
const COVER_UPLOAD_WORKER_URL = 'https://r2-presigner.baopengtoskr.workers.dev/';
const R2_PUBLIC_BASE_URL = 'https://pub-e97c7ebcf6e7475d85a27152bc869d5f.r2.dev';

function setupCoverUpload() {
  const input = $('#coverUpload');
  const url = $('[name=image]');
  const preview = $('#coverPreview');
  const message = $('#coverMessage');
  const save = $('#form button[type=submit]');
  function show() {
    preview.hidden = !url.value;
    preview.src = url.value;
  }
  show();
  url.addEventListener('input', show);

  async function timedFetch(address, options, milliseconds) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), milliseconds);
    try { return await fetch(address, { ...options, signal: controller.signal }); }
    finally { clearTimeout(timer); }
  }

  input.onchange = async () => {
    const file = input.files[0];
    if (!file || coverBusy) return;
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      message.textContent = '请选择 JPG、PNG 或 WebP 图片。';
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      message.textContent = '请选择小于 20 MB 的图片。';
      return;
    }
    const epoch = cloudEpoch;
    let objectUrl, phase = '压缩图片';
    coverBusy = true;
    input.disabled = true;
    url.disabled = true;
    save.disabled = true;
    message.textContent = '正在压缩封面…';
    try {
      requireCloudUser();
      objectUrl = URL.createObjectURL(file);
      const picture = new Image();
      await new Promise((resolve, reject) => {
        picture.onload = resolve;
        picture.onerror = () => reject(new Error('无法读取图片，请更换文件。'));
        picture.src = objectUrl;
      });
      const scale = Math.min(1, 400 / Math.max(picture.naturalWidth, picture.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(picture.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(picture.naturalHeight * scale));
      const context = canvas.getContext('2d');
      if (!context) throw new Error('浏览器无法创建图片压缩画布。');
      context.fillStyle = '#1b1c22';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(picture, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob(value => value ? resolve(value)
          : reject(new Error('JPEG 压缩失败。')), 'image/jpeg', 0.6);
      });

      phase = '获取上传地址';
      message.textContent = '正在获取 R2 上传地址…';
      const { data, error } = await cloud.auth.getSession();
      if (error) throw error;
      if (!data.session?.access_token) throw new Error('登录已失效，请重新登录。');
      const filename = (file.name.replace(/\.[^.]+$/, '') || 'cover') + '.jpg';
      const response = await timedFetch(COVER_UPLOAD_WORKER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + data.session.access_token
        },
        body: JSON.stringify({ filename, contentType: 'image/jpeg' })
      }, 20000);
      let result;
      try { result = await response.json(); }
      catch { throw new Error(`Worker 没有返回有效 JSON（HTTP ${response.status}）。`); }
      if (!response.ok) throw new Error(result.error || `Worker 请求失败（HTTP ${response.status}）。`);
      if (typeof result.uploadUrl !== 'string' || typeof result.publicUrl !== 'string')
        throw new Error('Worker 响应缺少 uploadUrl 或 publicUrl。');
      const upload = new URL(result.uploadUrl);
      const publicAddress = new URL(result.publicUrl);
      if (upload.protocol !== 'https:' || upload.username || upload.password ||
        !upload.hostname.endsWith('.r2.cloudflarestorage.com') ||
        !upload.pathname.startsWith('/covers/covers/') ||
        publicAddress.origin !== new URL(R2_PUBLIC_BASE_URL).origin ||
        !publicAddress.pathname.startsWith('/covers/'))
        throw new Error('Worker 返回的上传地址或公开域名不符合配置。');

      phase = 'PUT 上传图片';
      message.textContent = '正在上传封面到 R2…';
      const uploaded = await timedFetch(upload.href, {
        method: 'PUT',
        // 必须与签名时一致；不要附带 Supabase Authorization。
        headers: { 'Content-Type': 'image/jpeg' },
        body: blob
      }, 120000);
      if (!uploaded.ok)
        throw new Error(`R2 上传失败（HTTP ${uploaded.status}），请检查签名、Content-Type 和桶权限。`);
      if (epoch !== cloudEpoch || !url.isConnected)
        throw new Error('登录状态或编辑窗口已变化，请重新打开记录。');
      // 原表单保存逻辑会将这个输入框的值写入 data.image。
      // 只有上传成功后才替换，因此失败时保留原封面链接。
      url.value = publicAddress.href;
      show();
      message.textContent = '封面已上传。点击「保存记录」后，两个人都能看到。';
    } catch (error) {
      const detail = error.name === 'AbortError' ? '请求超时，请稍后重试。'
        : error instanceof TypeError ? '网络请求失败，请检查 Worker 与 R2 的 CORS、网址及网络。'
        : friendlyError(error);
      message.textContent = `封面上传失败（${phase}）：${detail} 可改用图片链接。`;
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      coverBusy = false;
      input.disabled = false;
      url.disabled = false;
      save.disabled = false;
    }
  };
}

// 事件委托同时覆盖筛选器、表单和日历动态创建的按钮。
function buttonWave(button, x, y) {
 if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
 const rect = button.getBoundingClientRect();
 const size = Math.hypot(rect.width, rect.height) * 2;
 const wave = document.createElement('span');
 wave.className = 'click-wave';
 wave.setAttribute('aria-hidden', 'true');
 wave.style.width = wave.style.height = size + 'px';
 wave.style.left = (x - rect.left - size / 2) + 'px';
 wave.style.top = (y - rect.top - size / 2) + 'px';
 button.appendChild(wave);
 wave.addEventListener('animationend', () => wave.remove(), { once: true });
 setTimeout(() => wave.remove(), 650);
}
document.addEventListener('pointerdown', e => {
 if (e.button !== 0) return;
 const button = e.target.closest('button');
 if (button && !button.disabled) buttonWave(button, e.clientX, e.clientY);
});
document.addEventListener('keydown', e => {
 if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
 const button = e.target.closest('button');
 if (button && !button.disabled) {
  const rect = button.getBoundingClientRect();
  buttonWave(button, rect.left + rect.width / 2, rect.top + rect.height / 2);
 }
});

  item.hotels=(Array.isArray(item.hotels)?item.hotels:typeof item.hotel==='string'&&item.hotel.trim()?[{name:item.hotel}]:[]).filter(h=>h&&typeof h==='object').slice(0,20).map(h=>({name:String(h.name||'').trim().slice(0,200),checkIn:isoDay(h.checkIn),checkOut:isoDay(h.checkOut),note:String(h.note||'').slice(0,500)})).filter(h=>h.name);
  item.hotel=item.hotels.map(h=>h.name).join('、');
  item.photos=travelPhotos(item).filter(url=>url!==item.image).slice(0,item.image?9:10);
 }else{delete item.endDate;delete item.hotels;delete item.photos;}
 if(item.cat==='music'){try{item.musicUrl=item.musicUrl?qqShareInfo(item.musicUrl).url:''}catch{item.musicUrl=''}}else delete item.musicUrl;
 return item;
}

async function compressTravelImage(file){
 const address=URL.createObjectURL(file);
 try{const picture=new Image();await new Promise((resolve,reject)=>{picture.onload=resolve;picture.onerror=()=>reject(new Error('无法读取图片，请更换文件'));picture.src=address});
 const scale=Math.min(1,1000/Math.max(picture.naturalWidth,picture.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(picture.naturalWidth*scale));canvas.height=Math.max(1,Math.round(picture.naturalHeight*scale));const context=canvas.getContext('2d');if(!context)throw Error('浏览器无法压缩图片');context.fillStyle='#1b1c22';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(picture,0,0,canvas.width,canvas.height);
 return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('图片压缩失败')),'image/jpeg',0.75));
 }finally{URL.revokeObjectURL(address)}
}
async function uploadR2Photo(blob,name){
 const {data,error}=await cloud.auth.getSession();if(error)throw error;if(!data.session?.access_token)throw Error('登录已失效，请重新登录');
 async function request(url,options,timeout){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}}
 const response=await request(COVER_UPLOAD_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({filename:(name.replace(/\.[^.]+$/,'').slice(0,140)||'travel')+'.jpg',contentType:'image/jpeg'})},20000);
 let result;try{result=await response.json()}catch{throw Error(`Worker 返回无效 JSON（HTTP ${response.status}）`)}if(!response.ok)throw Error(result.error||`Worker 请求失败（HTTP ${response.status}）`);
 const upload=new URL(result.uploadUrl),publicAddress=new URL(result.publicUrl);
 if(upload.protocol!=='https:'||upload.username||upload.password||!upload.hostname.endsWith('.r2.cloudflarestorage.com')||!upload.pathname.startsWith('/covers/covers/')||publicAddress.origin!==new URL(R2_PUBLIC_BASE_URL).origin||!publicAddress.pathname.startsWith('/covers/'))throw Error('上传地址或公开域名不符合配置');
 const put=await request(upload.href,{method:'PUT',headers:{'Content-Type':'image/jpeg'},body:blob},120000);if(!put.ok)throw Error(`R2 上传失败（HTTP ${put.status}），请检查 CORS 和签名`);return publicAddress.href;
}
async function uploadTravelPhotos(id,files){
 if(galleryBusy||writeBusy||coverBusy)return;
 const item=records.find(r=>r.id===id),row=rawRows.get(id);if(!item||!row)return;
 const existing=travelPhotos(item),remaining=10-existing.length,message=$('#galleryMessage');if(!files.length)return;
 if(files.length>remaining){message.textContent=`最多十张（含封面），还可上传 ${remaining} 张。`;return}
 if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20*1024*1024)){message.textContent='请选择每张小于 20 MB 的 JPG、PNG 或 WebP 图片。';return}
 const epoch=cloudEpoch;galleryBusy=true;render();
 try{requireCloudUser();const uploaded=[];for(const [i,file] of files.entries()){
 if(epoch!==cloudEpoch)throw Error('登录状态已变化，请重新打开记录');
 const status=$('#galleryMessage');if(status)status.textContent=`正在上传 ${i+1} / ${files.length} 张…`;
 uploaded.push(await uploadR2Photo(await compressTravelImage(file),file.name));}
 if(epoch!==cloudEpoch)throw Error('登录状态已变化，请重新打开记录');
 const all=[...existing,...uploaded],data={...item,image:all[0],photos:all.slice(1)};delete data.id;
 await saveSharedItem(data,id,row.content);if(epoch!==cloudEpoch)return;await loadSharedItems();toast('旅行照片已保存并同步');
 }catch(error){if(epoch===cloudEpoch){const status=$('#galleryMessage');if(status)status.textContent='上传失败：'+friendlyError(error);toast('上传失败：'+friendlyError(error));}}
 finally{galleryBusy=false;if(epoch===cloudEpoch&&detailId()===id){const status=$('#galleryMessage')?.textContent||'';render();if(status.startsWith('上传失败'))$('#galleryMessage').textContent=status;}}
}
async function removeTravelPhoto(id,index){
 if(galleryBusy||writeBusy||coverBusy||!confirm('从这份回忆中移除照片？R2 原文件不会被删除。'))return;
 const item=records.find(r=>r.id===id),row=rawRows.get(id);if(!item||!row)return;const epoch=cloudEpoch;galleryBusy=true;
 try{const pics=travelPhotos(item);pics.splice(index,1);const data={...item,image:pics[0]||'',photos:pics.slice(1)};delete data.id;await saveSharedItem(data,id,row.content);if(epoch===cloudEpoch)await loadSharedItems();}
 catch(error){if(epoch===cloudEpoch)toast(friendlyError(error))}finally{galleryBusy=false;if(epoch===cloudEpoch)render()}
}
// 仅向 QQ 官方固定 API 发起 JSONP；分享地址需严格校验，不能作为脚本地址使用。
function qqShareInfo(text){
 const match=String(text).match(/https?:\/\/[^\s<>"'，。)）]+/i);if(!match)throw Error('请粘贴 QQ 音乐分享链接或完整分享文字');
 const url=new URL(match[0]);if(url.protocol!=='https:'||!(url.hostname==='y.qq.com'||url.hostname.endsWith('.y.qq.com'))||url.username||url.password)throw Error('仅支持 QQ 音乐的 https 分享链接');
 const path=url.pathname,album=/\/album(?:Detail)?\/([A-Za-z0-9]+)/i.exec(path)?.[1]||url.searchParams.get('albummid'),mid=/\/song(?:Detail)?\/([A-Za-z0-9]+)/i.exec(path)?.[1]||url.searchParams.get('songmid')||url.searchParams.get('mid');
 return {url:url.href,mid:mid&&/^[A-Za-z0-9]+$/.test(mid)?mid:'',album:album&&/^[A-Za-z0-9]+$/.test(album)?album:'',songId:/^\d+$/.test(url.searchParams.get('songid')||'')?url.searchParams.get('songid'):'',title:/《([^》]+)》/.exec(text)?.[1]||'',artist:/分享\s*(.*?)\s*的(?:单曲|歌曲|专辑)/.exec(text)?.[1]||''};
}
function qqJSONP(path,params,callbackParam='callback'){
 return new Promise((resolve,reject)=>{const callback='__twoUsQQ_'+crypto.randomUUID().replaceAll('-',''),url=new URL(path,'https://c.y.qq.com');if(url.origin!=='https://c.y.qq.com'){reject(Error('音乐接口地址不合法'));return}
 Object.entries({...params,format:'jsonp',[callbackParam]:callback}).forEach(([key,value])=>url.searchParams.set(key,value));
 const script=document.createElement('script');let timer;const clean=()=>{clearTimeout(timer);delete window[callback];script.remove()};window[callback]=data=>{clean();resolve(data)};script.onerror=()=>{clean();reject(Error('QQ 音乐接口无法访问，请检查网络或手动填写'))};timer=setTimeout(()=>{clean();reject(Error('QQ 音乐读取超时，可手动填写音乐条目'))},12000);script.src=url.href;document.head.append(script);
 });
}
async function readQQMusic(text){
 const info=qqShareInfo(text);
 if(info.album){const response=await qqJSONP('/v8/fcg-bin/fcg_v8_album_info_cp.fcg',{albummid:info.album},'jsonpCallback'),data=response.data;if(response.code!==0||!data)throw Error('未能读取专辑，请手动填写');return {title:data.name||data.albumname||info.title,desc:data.singername||'',image:`https://y.gtimg.cn/music/photo_new/T002R500x500M000${info.album}.jpg`,musicUrl:info.url,sub:'专辑'}}
 if(!info.mid&&!info.songId&&info.title){const result=await qqJSONP('/soso/fcgi-bin/client_search_cp',{p:1,n:5,w:info.title+' '+info.artist},'jsonpCallback');const found=result.data?.song?.list?.find(s=>s.songname===info.title&&(!info.artist||s.singer?.some(a=>a.name===info.artist)));info.mid=found?.songmid||'';if(!info.mid)return {title:info.title,desc:info.artist,image:'',musicUrl:info.url,sub:'单曲',partial:true};}
 if(!info.mid&&!info.songId)throw Error('短链接无法直接识别，请复制包含歌名的完整分享文字，或打开后复制歌曲／专辑详情链接');
 const result=await qqJSONP('/v8/fcg-bin/fcg_play_single_song.fcg',info.mid?{songmid:info.mid,tpl:'yqq_song_detail'}:{songid:info.songId,tpl:'yqq_song_detail'}),song=result.data?.[0];if(result.code!==0||!song)throw Error('未能读取歌曲，请检查链接或手动填写');
 return {title:song.name||song.title||info.title,desc:(song.singer||[]).map(s=>s.name).join(' / ')+(song.album?.name?' · '+song.album.name:''),image:song.album?.mid?`https://y.gtimg.cn/music/photo_new/T002R500x500M000${song.album.mid}.jpg`:'',musicUrl:info.url,sub:'单曲'};
}
function setupMusicImport(){
 const button=$('#readQQMusic');button.onclick=async()=>{const epoch=cloudEpoch;button.disabled=true;$('#qqMessage').textContent='正在读取 QQ 音乐…';try{const item=await readQQMusic($('#qqShareInput').value||$('[name=musicUrl]').value);if(epoch!==cloudEpoch||!button.isConnected)return;for(const key of ['title','desc','musicUrl','sub'])$('[name='+key+']').value=item[key]||'';if(item.image){$('[name=image]').value=item.image;$('[name=image]').dispatchEvent(new Event('input'))}$('#qqMessage').textContent=item.partial?'已读取分享文字，封面请手动补充；确认后保存。':'已读取音乐信息，确认后点击保存记录。';}catch(error){if(button.isConnected)$('#qqMessage').textContent=friendlyError(error)}finally{button.disabled=false}};
}
